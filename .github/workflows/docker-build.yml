name: Build and Push Docker Image

# 1. 触发条件：当代码被推送到 main 分支时运行
on:
  push:
    branches:
      - main

# 2. 定义要执行的任务
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：检出你的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：登录到 Docker Hub，使用我们之前设置的秘密
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 步骤3：设置 Docker Buildx (用于高级构建功能，如多平台镜像)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤4：构建并推送镜像
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .               # 构建上下文，即当前目录
          push: true               # 构建完成后推送到仓库
          tags: ${{ secrets.DOCKER_USERNAME }}/my-app:latest  # 替换 my-app 为你的镜像名
          # 可选：支持多平台构建，比如同时构建 amd64 和 arm64 架构
          # platforms: linux/amd64,linux/arm64
